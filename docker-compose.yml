services:
  latex-service:
    build:
      context: ./latex-service
      dockerfile: Dockerfile
    container_name: swiftly-latex-service
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - NODE_ENV=production
    restart: unless-stopped
    # Resource limits — pdflatex can be memory hungry
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  postgres:
    image: postgres:15-alpine
    container_name: swiftly-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: swiftly
      POSTGRES_PASSWORD: swiftlypassword
      POSTGRES_DB: swiftlydb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
