name: Extension CI & Build

on:
  push:
    paths: ["extension/**"]
  pull_request:
    paths: ["extension/**"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install dependencies
        working-directory: extension
        run: bun install

      - name: Build extension (Chrome)
        working-directory: extension
        run: bun run build

      - name: Create zip for Web Store
        working-directory: extension
        run: bun run zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: swiftly-extension
          path: extension/.output/*.zip